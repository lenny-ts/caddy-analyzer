apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caddy-analyzer.fullname" . }}
  labels:
    {{- include "caddy-analyzer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "caddy-analyzer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "caddy-analyzer.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: caddy-analyzer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /etc/caddy-analyzer
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/caddy-analyzer/caddy-analyzer.json
              subPath: caddy-analyzer.json
              readOnly: true
            - name: logs
              mountPath: {{ .Values.logVolume.mountPath }}
              readOnly: true
            {{- if .Values.dockerSocket.enabled }}
            - name: docker-socket
              mountPath: {{ .Values.dockerSocket.mountPath }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "caddy-analyzer.fullname" . }}
        {{- if .Values.logVolume.existingClaim }}
        - name: logs
          persistentVolumeClaim:
            claimName: {{ .Values.logVolume.existingClaim }}
        {{- else if .Values.logVolume.hostPath }}
        - name: logs
          hostPath:
            path: {{ .Values.logVolume.hostPath }}
            type: {{ .Values.logVolume.hostPathType }}
        {{- else }}
        - name: logs
          emptyDir: {}
        {{- end }}
        {{- if .Values.dockerSocket.enabled }}
        - name: docker-socket
          hostPath:
            path: {{ .Values.dockerSocket.hostPath }}
            type: Socket
        {{- end }}
