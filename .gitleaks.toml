title = "caddy-analyzer gitleaks config"

[extend]
useDefault = true

# Test fixtures under testdata/ are generated by testdata/generate.py and
# intentionally contain synthetic JWT tokens / fake secrets to exercise
# caddy-analyzer's detection rules. They are not real credentials.
[allowlist]
paths = [
  '''testdata/sample\.log''',
  '''testdata/large\.log''',
]
