name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    name: Run Verification Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
      - run: go test -race -v ./...

  release-goreleaser:
    name: Build, Publish & Sign
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          changelog_section=$(mktemp "$RUNNER_TEMP/changelog.XXXXXX.md")
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "Unable to extract $RELEASE_TAG from CHANGELOG.md" >&2
            exit 1
          fi
          sed -n "/^## \[$version\]/,/^## \[/p" CHANGELOG.md | sed '$d' > "$changelog_section"
          {
            printf '# caddy-analyzer %s\n\n' "$RELEASE_TAG"
            printf 'Analyze Caddy v2 logs with security detection, operational metrics, and firewall protection.\n\n'
            printf '## Install / Upgrade\n\n'
            printf '```bash\n'
            printf '# Fresh install\n'
            printf 'curl -sSfL https://raw.githubusercontent.com/lenny-ts/caddy-analyzer/main/install.sh | bash\n'
            printf 'go install github.com/lenny-ts/caddy-analyzer/cmd/caddy-analyze@latest\n'
            printf 'docker run --rm -v /var/log/caddy:/logs ghcr.io/lenny-ts/caddy-analyzer /logs/access.log\n'
            printf '```\n\n'
            printf '## Upgrade\n\n'
            printf 'For an existing installation, `caddy-analyze update` downloads the latest release, verifies its Cosign signature and SHA256 checksum, and replaces the binary atomically. Use `--check` to preview the available version, or `--version v0.7.0` to install this exact release.\n\n'
            printf '```bash\n'
            printf 'caddy-analyze update --check\n'
            printf 'caddy-analyze update\n'
            printf 'caddy-analyze update --version v0.7.0\n'
            printf '```\n\n'
            cat "$changelog_section"
          } > "$RUNNER_TEMP/release-notes.md"
          rm -f "$changelog_section"

      - name: Install Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign checksums with cosign (keyless)
        working-directory: dist
        run: |
          cosign initialize
          curl --fail --location --retry 3 \
            --output trusted_root.json \
            https://raw.githubusercontent.com/sigstore/root-signing/main/targets/trusted_root.json
          cosign sign-blob --yes \
            --bundle checksums.txt.bundle \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: Upload SBOM and signatures
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          append_body: false
          files: |
            dist/*.spdx.json
            dist/checksums.txt.bundle
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/trusted_root.json
