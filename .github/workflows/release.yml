name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    name: Run Verification Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
      - run: go test -race -v ./...

  release-goreleaser:
    name: Build, Publish & Sign
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          changelog_section=$(mktemp "$RUNNER_TEMP/changelog.XXXXXX.md")
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "Unable to extract $RELEASE_TAG from CHANGELOG.md" >&2
            exit 1
          fi
          sed -n "/^## \[$version\]/,/^## \[/p" CHANGELOG.md | sed '$d' > "$changelog_section"
          {
            printf '# caddy-analyzer %s\n\n' "$RELEASE_TAG"
            printf 'Analyze Caddy v2 logs with security detection, operational metrics, and firewall protection.\n\n'
            printf '## Install\n\n'
            printf '```bash\n'
            printf '# Fresh install\n'
            printf 'curl -sSfL https://raw.githubusercontent.com/lenny-ts/caddy-analyzer/main/install.sh | bash\n'
            printf 'go install github.com/lenny-ts/caddy-analyzer/cmd/caddy-analyze@latest\n'
            printf 'docker run --rm -v /var/log/caddy:/logs ghcr.io/lenny-ts/caddy-analyzer /logs/access.log\n'
            printf '```\n\n'
            printf '## Upgrade\n\n'
            printf 'For an existing installation, `caddy-analyze update` downloads the latest release, verifies its Cosign signature and SHA256 checksum, and replaces the binary atomically. Use `--check` to preview the available version, or `--version %s` to install this exact release.\n\n' "$RELEASE_TAG"
            printf '```bash\n'
            printf 'caddy-analyze update --check\n'
            printf 'caddy-analyze update\n'
            printf 'caddy-analyze update --version %s\n' "$RELEASE_TAG"
            printf '```\n\n'
            cat "$changelog_section"
          } > "$RUNNER_TEMP/release-notes.md"
          rm -f "$changelog_section"

      - name: Install Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with cosign (keyless)
        working-directory: dist
        run: |
          cosign initialize
          curl --fail --location --retry 3 \
            --output trusted_root.json \
            https://raw.githubusercontent.com/sigstore/root-signing/main/targets/trusted_root.json
          # Preserve legacy sidecars alongside the bundle for older updaters.
          cosign sign-blob --yes --use-signing-config=false \
            --bundle checksums.txt.bundle \
            --new-bundle-format \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: Keep bootstrap release compatible with older updaters
        if: github.ref_name == 'v0.7.1'
        run: rm -f dist/checksums.txt.bundle

      - name: Upload SBOM and signatures
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          append_body: false
          files: |
            dist/*.spdx.json
            dist/checksums.txt.bundle
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/trusted_root.json

  release-docker:
    name: Publish Docker image
    needs: [release-goreleaser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare image tags
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$RELEASE_TAG,$image:${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != *-* ]]; then
            tags="$tags,$image:latest"
          fi
          {
            echo "name=$image"
            echo "tags=$tags"
            echo "version=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: VERSION=${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          output=$(docker run --rm "$IMAGE:$RELEASE_TAG" --version)
          echo "$output"
          [[ "$output" == "caddy-analyze version $VERSION" ]]
