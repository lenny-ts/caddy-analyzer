<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="caddy-analyzer">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0a0a0c"/>
            <stop offset="50%" stop-color="#131316"/>
            <stop offset="100%" stop-color="#1b1b21"/>
        </linearGradient>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#48d1cc"/>
            <stop offset="50%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#a78bfa"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#48d1cc" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#48d1cc" stop-opacity="0"/>
        </radialGradient>
        <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    </defs>

    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="600" cy="315" r="280" fill="url(#glow)"/>

    <g transform="translate(600,200)" opacity="0.15" filter="url(#blur)">
        <circle r="120" fill="#48d1cc"/>
    </g>

    <g transform="translate(600,210)">
        <path d="M0,-70 L20,-20 L70,0 L20,20 L0,70 L-20,20 L-70,0 L-20,-20 Z"
              fill="none" stroke="url(#grad)" stroke-width="4" stroke-linejoin="round"/>
        <circle r="18" fill="url(#grad)" opacity="0.9"/>
        <circle r="8" fill="#0a0a0c"/>
    </g>

    <text x="600" y="400" text-anchor="middle"
          font-family="'SF Mono','Fira Code',Consolas,monospace"
          font-size="76" font-weight="800" fill="url(#grad)">
        caddy-analyzer
    </text>
    <text x="600" y="455" text-anchor="middle"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="28" fill="#a8b0bd" letter-spacing="2">
        Real-time Caddy log analysis &amp; threat detection
    </text>

    <g transform="translate(600,540)" opacity="0.7">
        <rect x="-180" y="-18" width="360" height="36" rx="18"
              fill="none" stroke="#24242a" stroke-width="1.5"/>
        <text x="0" y="6" text-anchor="middle"
              font-family="'SF Mono',Consolas,monospace"
              font-size="16" fill="#48d1cc">
            analyze  ·  monitor  ·  report
        </text>
    </g>
</svg>
