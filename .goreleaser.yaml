version: 2
project_name: caddy-analyzer

before:
  hooks:
    - go mod tidy

builds:
  - id: caddy-analyze
    main: ./cmd/caddy-analyze
    binary: caddy-analyze
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/lenny-ts/caddy-analyzer/cmd.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm

archives:
  - id: default
    formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

sboms:
  - id: default
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]
    documents:
      - "${artifact}.spdx.json"
    artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
